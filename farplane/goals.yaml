kind: project-goals
status: active
project: Farplane
created_at: 2026-06-15
updated_at: 2026-07-07
framework_template_version: "0.5.0"
owner: horizon-advisor
source: horizon-advisor
refs:
  - farplane/harness.md
  - farplane/products.md
  - farplane/bindings.yaml
  - farplane/automations.toml
  - docs/fundamentals/harness-algebra.md
  - skills/horizon-advisor/SKILL.md
  - skills/goal-advisor/SKILL.md
north_star: >-
  Farplane becomes the standard way researchers and builders create harnesses
  that run longer, improve from evidence, and produce higher-quality results
  with less human intervention.
value_function:
  maximize:
    - meaningful_long_running_output
    - accepted_agent_output
    - quality
    - validated_improvement
    - reliability
    - reusable_behavior
    - auditability
    - context_isolated_execution
  minimize:
    - human_intervention
    - false_completion
    - agent_churn
    - coordination_cost
    - ungrounded_claims
    - brittle_state_loss
    - context_bleed
    - source_gaps
    - skill_backpropagation_delay
  preserve:
    - user_goal_satisfaction
    - groundedness
    - correctness
    - safety
    - proof
    - operator_control
    - context_isolation
goals:
  validated_self_improvement:
    question: Can Farplane complete meaningful improvement cycles with less human intervention?
    evidence_hints:
      - validated cycles
      - accepted harness improvements
      - human attention minutes
      - autonomous worker elapsed minutes
      - skill backpropagation events
    smart_goals:
      - id: autonomous_improvement_q3
        target: >-
          20 accepted harness improvements and more autonomous worker time than
          human thread attention by 2026-09-30
        kpis:
          - id: accepted_harness_improvements
            target: 20
            direction: above
          - id: accepted_evidence_cycles
            target: 20
            direction: above
          - id: interesting_autonomy_results
            target: 5
            direction: above
          - id: auto_time_ratio
            target: 1
            direction: above
          - id: ticket_intervention_turn_count
            target: 0
            direction: below
          - id: rejected_ai_ticket_count
            target: 0
            direction: below
          - id: auto_completion_rate
            target: 0.8
            direction: above
        interpretation: >-
          The main autonomy claim is stronger when accepted improvements and
          evidence cycles rise, interesting results appear in ticket proof, and
          auto_time_ratio exceeds 1 while post-start ticket intervention turns
          and rejected AI-planned tickets fall. Treat turn-count intervention
          metrics as supporting KPIs until ticket/thread association coverage is
          reliable.
  quality_and_proof:
    question: Do long-running agents preserve quality, proof, and operator control?
    evidence_hints:
      - sufficient proof
      - validator pass rate
      - false completion incidents
      - proof closure rate
    smart_goals:
      - id: proof_quality_q3
        target: 90% of completed material tickets have sufficient proof and review evidence by 2026-09-30
        kpis:
          - id: latest_eval_pass_rate
            target: 0.9
            direction: above
        interpretation: >-
          Quality is improving when proof closure and eval pass rate hold while
          issue/PR backlog stays bounded. Missing review-pass-rate providers
          should become source gaps or instrumentation tickets, not fake counts.
  project_control:
    question: Can Farplane control dynamic projects with their own completion criteria and intervention budgets?
    evidence_hints:
      - active projects with goals and proof state
      - useful interval reports
      - projects advanced without human unblock
    smart_goals:
      - id: project_control_q3
        target: Keep ready unclaimed tickets under 3 while completing 10 Pulse execution cycles by 2026-09-30
        kpis:
          - id: ready_unclaimed_ticket_count
            target: 3
            direction: below
        interpretation: >-
          Project control is improving when Pulse keeps executing or requesting
          useful planning, stale and ready-unclaimed tickets stay low, and more
          accepted work is handled by autonomous workers.
  distribution_from_evidence:
    question: Can Farplane turn real harness evidence into audience, users, and research authority?
    evidence_hints:
      - evidence-backed content shipped
      - qualified attention
      - serious conversations
      - pilot users
    smart_goals:
      - id: evidence_distribution_q3
        target: 100000 evidence-backed content views by 2026-09-30
        kpis:
          - id: instagram_views
            target: 50000
            direction: above
          - id: x_views
            target: 50000
            direction: above
        interpretation: >-
          Distribution matters only when it is tied to real harness evidence,
          so the goal tracks concrete platform view KPIs directly. The combined
          reach rollup is a pinned overview summary, not the accountability
          surface for the SMART goal.
current_bets:
  - id: framework_standardization
    horizon: 1 week
    output: clear tracked config split for harness, products, goals, bindings, tickets, and reports
    proof_signal: project-file validators and docs make ownership obvious
    owner: harness-creator
  - id: goal_advisor_program_grammar
    horizon: 1 week
    output: clear Horizon Advisor to Goal Advisor boundary
    proof_signal: agents do not duplicate strategy and execution roles
    owner: horizon-advisor
  - id: low_intervention_experiment_engine
    horizon: quarter
    output: experiment and ablation reports that improve Farplane with explicit intervention/proof accounting
    proof_signal: accepted improvements with baseline, metric, proof, and accept/reject decision
    owner: optimize-harness
  - id: evidence_distribution_engine
    horizon: quarter
    output: evidence-backed content and demos from accepted experiments
    proof_signal: qualified attention, serious conversations, pilot users
    owner: social-content
  - id: pulse_interval_framework_standard
    horizon: 2 weeks
    output: reusable Pulse plus Daily/Weekly Interval automation standard
    proof_signal: a project initializes the preset without custom files
    owner: automation-advisor
  - id: skill_memory_hierarchy
    horizon: 2 weeks
    output: local lessons and skill findings roll up without losing project context
    proof_signal: parent reports summarize child state without reading every child report
    owner: skill-maintenance
current_milestone: >-
  Make Farplane's horizon layer explicit enough to optimize meaningful
  long-running autonomous improvement per human intervention hour, while
  preserving quality, proof, operator control, and context isolation.
holds:
  - do_not_add_hidden_daemon_behavior
  - do_not_store_secrets_in_tracked_config
  - do_not_make_notion_canonical_until_project_explicitly_opts_in
  - do_not_execute_broad_leaf_tickets_from_interval_automations
  - do_not_split_projects_into_child_tickets_without_real_boundary
  - do_not_claim_self_improvement_without_baseline_metric_proof_intervention_accounting_and_decision
  - do_not_optimize_distribution_metrics_independently_from_evidence_backed_harness_improvement
