operator:
  review_chase_policy: >-
    Kenji is generally chaseable during his active hours, roughly 10:00 to
    01:00 Asia/Kuala_Lumpur unless he says otherwise. Review reminders are due
    only from an undecided ticket progress Review block whose next_reminder_at
    has matured. Work Pulse may select at most one due reminder per beat and
    sends it without assigning a worker; review queue size is backpressure, not
    a chase trigger. Record the Telegram message id, next reminder or cap, and
    blocker in progress.md. Phone-chaser requires an explicit operator or
    automation decision and is never inferred from queue size alone.
