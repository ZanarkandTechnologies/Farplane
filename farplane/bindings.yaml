metric_bindings:
  accepted_evidence_cycles:
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>", kpi_key="accepted_evidence_cycles"); count only ticket-scoped review evidence with verdict pass at TAS-A, and store gaps when acceptance evidence is missing.
  accepted_trust_ablations:
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>", kpi_key="accepted_trust_ablations") and store the returned value/status/payload in the daily metric file.
  accepted_harness_improvements:
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>", kpi_key="accepted_harness_improvements") and store the returned value/status/payload in the daily metric file.
  interesting_autonomy_results:
    refresh: 'Read tickets touched, completed, or archived in the review window. Inspect each ticket''s Done / Proof, progress log, and linked artifacts. Count each distinct result that scores 4 or higher on this rubric: specific evidence or output, non-obvious learning, actionable follow-up or reusable pattern, relevance to Farplane''s autonomy goal, and proof that the result actually happened. Do not count routine status updates, duplicate observations, vague plans, or unproved claims. Store the numeric count as the metric value and include ticket refs, artifact refs, per-item scores, count/skip verdicts, short reasons, threshold, and gaps in the observation payload.'
  auto_time_ratio:
    refresh: Call $interval-update.calculate_autonomy_time_ratio(runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the returned value/status/payload for this metric.
  evidence_distribution_reach:
    refresh: Sum available same-window daily readings from x_views, instagram_views, and github_views for overview display; use source_gap when no component reading exists.
  latest_eval_pass_rate:
    refresh: Read the latest eval summary pass_rate for the snapshot window and store value/status/payload in the daily metric file.
  decision_changing_learning_briefs:
    refresh: Count completed tickets or learning artifacts in the review window whose Reward.kpi_rewards includes decision_changing_learning_briefs and whose proof names the decision changed, the evidence refs, and the next workflow, distribution, or no-action move.
  github_views:
    refresh: Use gh api for ZanarkandTechnologies/Farplane traffic views on <YYYY-MM-DD>; store source_gap when traffic permissions are unavailable.
  auto_completion_rate:
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets", runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the auto_completion_rate reading.
  rejected_ai_ticket_count:
    refresh: Call `farplane metrics primitives --project-root <project> --date <YYYY-MM-DD> --ticket-status rejected --json`; store `ticket_count_by_kpi_status:rejected._total.value` as this metric, with the per-KPI rejected counts in payload.
  intervention_free_ticket_count:
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets", runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the intervention_free_ticket_count reading.
  ticket_intervention_turn_count:
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets", runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the ticket_intervention_turn_count reading.
  todo_unclaimed_ticket_count:
    refresh: Count unclaimed status=todo tickets under tickets/ whose dependencies are satisfied; store value/status/payload in the daily metric file.
  x_followers:
    refresh: Call $x-account for the Farplane X account and record the current follower count; store source_gap if credentials or API access are unavailable.
  x_views:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="x", kpi_key="x_views", date="<YYYY-MM-DD>", window_days=7), then call $x-account with the returned tweet IDs and store the aggregate x_views value plus per-post payload.items.
  x_likes:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="x", kpi_key="x_likes", date="<YYYY-MM-DD>", window_days=7), then call $x-account with the returned tweet IDs and store the aggregate x_likes value plus per-post payload.items.
  instagram_followers:
    refresh: Call $instagram-account for the Farplane Instagram account and record the current follower count; store source_gap if unavailable.
  instagram_views:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_views", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs and store the aggregate instagram_views value plus per-post payload.items.
  instagram_likes:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_likes", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs and store the aggregate instagram_likes value plus per-post payload.items.
  instagram_comments:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_comments", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_comments value plus per-post payload.items.
  instagram_shares:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_shares", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_shares value plus per-post payload.items.
  instagram_saves:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_saves", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_saves value plus per-post payload.items.
  instagram_reach:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_reach", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_reach value plus per-post payload.items.
  instagram_total_interactions:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_total_interactions", date="<YYYY-MM-DD>", window_days=7), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_total_interactions value plus per-post payload.items.
  instagram_avg_watch_time:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_avg_watch_time", date="<YYYY-MM-DD>", window_days=30), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_avg_watch_time value plus per-reel payload.items when the API returns watch-time fields.
  instagram_total_watch_time:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_total_watch_time", date="<YYYY-MM-DD>", window_days=30), then call $instagram-account with the returned media IDs using --deep and store the aggregate instagram_total_watch_time value plus per-reel payload.items when the API returns watch-time fields.
  instagram_retention_score:
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl", platform="instagram", kpi_key="instagram_retention_score", date="<YYYY-MM-DD>", window_days=30), then call $instagram-account with the returned Reel media IDs using --deep and duration metadata when known. Store instagram_retention_score plus per-reel payload.items when the API returns watch-time fields; otherwise store source_gap with API/permission/duration gaps.
  posts_published:
    refresh: Count rows in `.farplane/content/ledger.jsonl` with status=posted and published_at on <YYYY-MM-DD>; store source_gap if the ledger is missing.
