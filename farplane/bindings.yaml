feed_scout:
  enabled: true
  cadence: daily
  timezone: Asia/Kuala_Lumpur
  report_root: .farplane/reports/feed-scout
  latest_report: .farplane/reports/feed-scout/latest.json
  daily_feed_root: .farplane/feed-scout/daily
  ledger: .farplane/feed-scout/ledger.jsonl
  proposal_ledger: .farplane/feed-scout/proposals.jsonl
  destination: local_ledger
  write_policy: local_first
  ui:
    default_view: daily_feed
    date_param: date
    latest_feed: .farplane/feed-scout/daily/latest.json
  entities:
    polsia:
      name: Polsia
      kind: competitor
      interest_prompt: >-
        Track concrete product, pricing, GTM, funding, hiring, customer proof,
        release, and autonomous-company workflow changes. Ignore static
        homepage rediscovery unless page content materially changed today.
        Prioritize details that affect Farplane positioning, proof strategy, or
        UI/product strategy.
      aliases:
        - Polsia
        - Ben Cera
      owned_sources:
        website:
          kind: website
          url: https://polsia.com/
          interest_prompt: >-
            Look for new product capabilities, pricing, proof claims, launch
            language, screenshots, customer metrics, and positioning changes
            since the previous crawl.
        x_founder:
          kind: x_profile
          handle: bencera
          url: https://x.com/bencera
        instagram:
          kind: instagram_profile
          handle: polsiahq
          url: https://www.instagram.com/polsiahq/
        linkedin_company:
          kind: linkedin_company
          url: https://www.linkedin.com/company/polsia
        github_org:
          kind: github_org
          org: Polsia-Inc
          url: https://github.com/Polsia-Inc
          interest_prompt: >-
            Only rank GitHub activity highly when it shows a release,
            meaningful feature work, documentation change, or public repo that
            reveals product direction.
      search_entity_on_platform:
        - x
        - reddit
        - web
        - trustpilot
      search_queries:
        - Polsia
        - '"Ben Cera" Polsia'
        - polsia.com
    paperclip:
      name: Paperclip
      kind: competitor
      interest_prompt: >-
        Track concrete product, pricing, GTM, funding, hiring, release, and
        agent-management workflow changes. Ignore static homepage rediscovery
        unless page content materially changed today. Prioritize details that
        affect Farplane positioning or UI/product strategy.
      aliases:
        - Paperclip
        - Paperclip AI
        - paperclip.ing
      owned_sources:
        website:
          kind: website
          url: https://paperclip.ing/
          fetch_method: web-page-scan
          interest_prompt: >-
            Look for new product capabilities, pricing, integration claims,
            org-chart/governance language, screenshots, customer proof, and
            launch/positioning changes since the previous crawl.
        docs:
          kind: docs
          url: https://docs.paperclip.ing/
        x:
          kind: x_profile
          handle: papercliping
          url: https://x.com/papercliping
        github_repo:
          kind: github_repo
          repo: paperclipai/paperclip
          url: https://github.com/paperclipai/paperclip
          fetch_method: github-api
          interest_prompt: >-
            Only rank repo activity highly when there is a release, meaningful
            feature commit, notable star/fork delta, or documentation change
            that reveals product direction.
      search_entity_on_platform:
        - x
        - reddit
        - web
        - github
      search_queries:
        - '"Paperclip" "AI agents"'
        - paperclip.ing
        - paperclipai/paperclip
    lukethedev:
      name: Luke The Dev
      kind: creator
      interest_prompt: >-
        Track creator posts, releases, demos, repo changes, and product pivots
        around OpenClaw, Claw3D, 3D agent workspaces, and agent observability.
        Ignore stale profile/homepage rediscovery unless there is a clear
        today-specific delta.
      aliases:
        - Luke The Dev
        - iamlukethedev
        - Claw3D
      owned_sources:
        linktree:
          kind: linktree
          url: https://linktr.ee/iamlukethedev
        x:
          kind: x_profile
          handle: iamlukethedev
          url: https://x.com/iamlukethedev
        github_user:
          kind: github_user
          user: iamlukethedev
          url: https://github.com/iamlukethedev
          fetch_method: github-api
          interest_prompt: >-
            Rank GitHub activity highly only when it contains a meaningful new
            repo, feature commit, release, docs change, or signal about Claw3D
            and agent workspace direction.
        website:
          kind: website
          url: https://www.claw3d.ai/
        youtube:
          kind: youtube_channel
          url: https://www.youtube.com/@Claw3DWorld
          fetch_method: youtube-rss
          interest_prompt: >-
            Rank new videos highly when they demonstrate agent workspace,
            observability, cost, workflow, or product positioning lessons that
            Farplane can adapt.
      search_entity_on_platform:
        - x
        - reddit
        - web
        - github
      search_queries:
        - '"Luke The Dev"'
        - iamlukethedev
        - Claw3D
metrics:
  accepted_evidence_cycles:
    label: Accepted evidence cycles
    product: experiments
    pinned: true
    kind: daily_count
    unit: cycles
    display: bar_plus_cumulative
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>",
      kpi_key="accepted_evidence_cycles") and store the returned value/status/payload in the
      daily metric file.
  accepted_harness_improvements:
    label: Accepted harness improvements
    product: productization
    pinned: true
    kind: daily_count
    unit: improvements
    display: bar_plus_cumulative
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>",
      kpi_key="accepted_harness_improvements") and store the returned value/status/payload
      in the daily metric file.
  auto_time_ratio:
    label: Autonomous time ratio
    product: cross_product_autonomy
    pinned: true
    kind: point
    unit: ratio
    display: reading
    refresh: Call $interval-update.calculate_autonomy_time_ratio(runtime_dir=".farplane",
      date="<YYYY-MM-DD>") and store the returned value/status/payload for this metric.
  evidence_distribution_reach:
    label: Evidence distribution reach
    product: distribution
    pinned: true
    kind: daily_count
    unit: views
    display: bar_plus_cumulative
    refresh: Sum available daily readings from x_views, instagram_views, github_views, and
      `.farplane/content/ledger.jsonl` in the same daily file; use source_gap when no component
      reading exists.
  latest_eval_pass_rate:
    label: Latest eval pass rate
    product: productization
    kind: point
    unit: ratio
    display: reading
    refresh: Read the latest eval summary pass_rate for the snapshot window and store value/status/payload
      in the daily metric file.
  github_views:
    label: GitHub views
    product: adoption
    kind: daily_count
    unit: views
    display: bar_plus_cumulative
    refresh: Use gh api for ZanarkandTechnologies/Farplane traffic views on <YYYY-MM-DD>;
      store source_gap when traffic permissions are unavailable.
  auto_completion_rate:
    label: Auto completion rate
    product: cross_product_autonomy
    kind: point
    unit: ratio
    display: reading
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets",
      runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the auto_completion_rate reading.
  intervention_free_ticket_count:
    label: Intervention-free tickets
    product: cross_product_autonomy
    kind: daily_count
    unit: tickets
    display: bar_plus_cumulative
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets",
      runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the intervention_free_ticket_count
      reading.
  ticket_intervention_turn_count:
    label: Ticket intervention turns
    product: cross_product_autonomy
    kind: daily_count
    unit: turns
    display: bar_plus_cumulative
    refresh: Call $interval-update.calculate_ticket_intervention_metrics(ticket_dir="tickets",
      runtime_dir=".farplane", date="<YYYY-MM-DD>") and store the ticket_intervention_turn_count
      reading.
  ready_unclaimed_ticket_count:
    label: Ready unclaimed tickets
    product: project_control
    kind: point
    unit: tickets
    display: reading
    refresh: Count ready, approval-free, unclaimed tickets under tickets/ that are not complete
      or human-gated; store value/status/payload in the daily metric file.
  x_followers:
    label: X followers
    product: distribution
    kind: point
    unit: followers
    display: line
    refresh: Call $x-account for the Farplane X account and record the current follower count;
      store source_gap if credentials or API access are unavailable.
  x_views:
    label: X views
    product: distribution
    kind: daily_count
    unit: views
    display: bar_plus_cumulative
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl",
      platform="x", kpi_key="x_views", date="<YYYY-MM-DD>", window_days=7), then call $x-account
      with the returned tweet IDs and store the aggregate x_views value plus per-post payload.items.
  x_likes:
    label: X likes
    product: distribution
    kind: daily_count
    unit: likes
    display: bar_plus_cumulative
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl",
      platform="x", kpi_key="x_likes", date="<YYYY-MM-DD>", window_days=7), then call $x-account
      with the returned tweet IDs and store the aggregate x_likes value plus per-post payload.items.
  instagram_followers:
    label: Instagram followers
    product: distribution
    kind: point
    unit: followers
    display: line
    refresh: Call $instagram-account for the Farplane Instagram account and record the current
      follower count; store source_gap if unavailable.
  instagram_views:
    label: Instagram views
    product: distribution
    kind: daily_count
    unit: views
    display: bar_plus_cumulative
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl",
      platform="instagram", kpi_key="instagram_views", date="<YYYY-MM-DD>", window_days=7),
      then call $instagram-account with the returned media IDs and store the aggregate instagram_views
      value plus per-post payload.items.
  instagram_likes:
    label: Instagram likes
    product: distribution
    kind: daily_count
    unit: likes
    display: bar_plus_cumulative
    refresh: Call $interval-update.select_content_metric_targets(content_ledger=".farplane/content/ledger.jsonl",
      platform="instagram", kpi_key="instagram_likes", date="<YYYY-MM-DD>", window_days=7),
      then call $instagram-account with the returned media IDs and store the aggregate instagram_likes
      value plus per-post payload.items.
  posts_published:
    label: Posts published
    product: distribution
    kind: daily_count
    unit: posts
    display: bar_plus_cumulative
    refresh: Count rows in `.farplane/content/ledger.jsonl` with status=posted and published_at
      on <YYYY-MM-DD>; store source_gap if the ledger is missing.
