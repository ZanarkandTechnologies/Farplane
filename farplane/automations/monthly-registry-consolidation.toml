# One complete desired-state Codex automation. Runtime state stays outside Git.
schema = "farplane_project_automation"
framework_template_version = "1.0.0"
owner = "automation-advisor"

id = "farplane-monthly-registry-consolidation"
name = "Farplane Monthly Registry Consolidation"
kind = "cron"
status = "active"
prompt = '''
Task storage override: follow tickets/README.md. Multica is dashboard-only;
resolve project bindings, keep issues unassigned, and use --no-start for updates.
Create/update task records through the existing Multica CLI, never ticket.md.
Do not invoke filesystem materializers, finalizers or dispatch based on local
migration snapshots. If a phase requires such a legacy adapter, report that
phase as unavailable; continue independent read-only reporting. Never start
Multica agents, squads, autopilots or runs.

Use $consolidate.

Review the Farplane skill, feature, system, template, and source registries for
duplication, staleness, and wrong ownership. Write a dated consolidation report
without editing registries or creating tickets during this run.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
review_window = "last_month"
structure = "registry"

Final response:
- Link the consolidation report path and summarize the key duplicate/stale/wrong-owner findings.
- List registry edits or tickets created; this run should normally report `none`.
- List recommended follow-ups with owner surface and reason.
- Name source gaps and include the no-mutation receipt.

Config source:
farplane/automations/monthly-registry-consolidation.toml id="farplane-monthly-registry-consolidation"
'''
[target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[schedule]
type = "monthly"
timezone = "Asia/Kuala_Lumpur"
day_of_month = 1
time = "06:15"
