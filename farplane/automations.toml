[[automations]]
id = "farplane-weekly-interval"
name = "Farplane Weekly BAU Review"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run one Weekly Interval over the previous completed week. Use completed Daily
reports, the current weekly working draft, and Daily receipts as primary
evidence. Give every candidate `promoted`, `duplicate`, `monitor`, `dismissed`,
`source_gap`, or `blocked`; freeze the weekly report before mutation; then apply
only authorized ticket and knowledge promotions through canonical owners, write
the observed-result receipt, finalize the draft, and open the next one. Do not
execute admitted work.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
interval_id = "weekly"
review_window = "last_week"
refresh_metrics = false
write_policy = "freeze the weekly report, append sparse highlights, then apply independently qualified ticket promotions through the configured authorized provider; no ticket execution"
knowledge_write_policy = "promote only source-backed candidates that pass their value gate, destination diff, authority, privacy, and owning-route validation; otherwise retain the disposition in the report"
timezone = "Asia/Kuala_Lumpur"

Reads:
- completed daily BAU reports inside the review window
- completed daily knowledge receipts inside the review window
- current weekly working draft
- completed Feed Scout reports inside the review window

Gates:
- no deploy, publish, spend, customer contact, account mutation, destructive cleanup, or private-data expansion
- no raw transcript content in reports, docs, skills, receipts, or Wiki pages

Final response:
- Link the finalized report, finalized draft, knowledge receipt, and next draft.
- List every candidate disposition and every promoted ticket/skill/doc/Wiki owner.
- Confirm the report was frozen before promotion and the next draft opened afterward.
- Name source gaps, operator-needed items, next owner, and the no-Goal/Pulse/worker/ticket-execution receipt.

