# Canonical desired-state Codex automation config for this Farplane project.
# Runtime logs, run IDs, last-run status, and automation memory stay outside tracked config.
schema = "farplane_project_automations"
framework_template_version = "1.0.0"
updated_at = "2026-07-14"
owner = "automation-advisor"

[[automations]]
id = "farplane-ticket-update"
name = "Farplane Work Pulse"
kind = "heartbeat"
status = "active"
prompt = '''
Use $pulse-update.

Run one bounded multi-phase Work Pulse: maintenance, due review service,
dispatch, low-watermark refill, then one combined receipt. Reconcile all safe
terminal state, route at most the review chase limit without consuming a
worker, dispatch unclaimed executable tickets up to the worker limit, and call
the one adaptive next-wave planner whenever unclaimed ready supply ends below
the configured watermark. Review WIP caps operator-facing area pools; when
those pools are full, keep safe workers productive by preferring machine-
verifiable or delayed-feedback work with low immediate human load.
Human-active tickets remain unavailable but do not consume Pulse worker
capacity. Workers execute ticket programs and produce proof; do not implement
ticket bodies or wait for workers inside the heartbeat. Use Farplane V1
terminology rather than retired product or v-next language.

Overrides:
- Treat the operator as unavailable unless current context explicitly proves
  availability. Do not admit work whose positive output depends on a human
  decision, dirty cross-project mutation, publication, outreach, credentials,
  or destructive authority during an unattended window.
- Self-improvement must prevent a recurring failure through a durable forward
  mechanism and name its next-run proof. One-off historical cleanup is
  maintenance, not compounding leverage.
- After two consecutive worker create/lookup failures, open a dispatch circuit
  for that mechanism until a later successful health check. Continue safe
  planning/refill, but do not repeat the same failed launch every wake.
- Apply the structured `farplane/bindings.yaml#operator.review_chase_policy`.
  An awaiting-review ticket without a valid Review block is repair work, not a
  silent wait. Initial Telegram, due Telegram reminders, and policy-selected
  Phone Chaser calls use automation-owned credentials and are not blocked by a
  worker ticket's no-credentials boundary. Record every send/dispatch receipt
  and never infer a chase from queue size.
- Treat blocked and awaiting-review ownership narrowly. They dedupe the same
  output or prerequisite, not an entire area, KPI, audience, or objective;
  continue admitting independent non-interfering artifact work.
- Pass optional `harness.yaml#goals`, derive completed goals from current metric
  direction/value, and ignore completed goals for urgency. Do not invent goals.
- Require delivery, ablation, experiment, rollout, and operations each to
  propose up to `wave_size` distinct candidates (or an evidence-backed
  shortfall) before one global ranking. Lanes never receive quotas.
- Query ticket/Reward history by lane when needed. For content/distribution
  hypotheses, use a relevant Tasty Pack as optional taste evidence without
  creating a content Pulse.
- Load `farplane/bindings.yaml#feed_scout.memory` once when it exists and pass
  relevant entry refs, freshness/confidence, source gaps, and a content hash to
  the planner. Every outward-facing admitted ticket must bind its canonical
  area ICP, a specific job or pain, a named baseline/default, the belief or
  workflow delta it should cause, and relevant memory/source refs. A trend name
  or generic ICP pain is not enough. Self-improvement may use local
  ticket/Reward/eval evidence when external memory is irrelevant.
- Keep review tickets distinct but summarize pending review in bounded
  per-area pools. Pass review_wip to the board projection, expose active versus
  queued pools plus one deterministic digest per active area, and never drop
  underlying ticket review refs or decisions. Full pools never globally block
  unattended-safe dispatch.
- Include derived semantic_time_state in the planner input for metric
  freshness, goal urgency/deadline buckets, matured Reward IDs, and operator
  availability validity. Serialization timestamps alone do not create novelty,
  but crossing one of those planning boundaries must change the fingerprint.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
wave_size = 10
worker_limit = 4
review_wip = 3
review_chase_limit = 1
ready_low_watermark = 20

Final response:
- State the action taken or no-op reason.
- List tickets dispatched, chased, admitted, completed/reconciled, or blocked.
- Summarize refill outcome, worker/review limits, source gaps, and next owner.
- Link any report, ticket, worker, or receipt artifacts created by the beat.

Config source:
farplane/automations.toml automation id="farplane-ticket-update"
'''
[automations.target]
thread_id = "019ed47a-3182-73f3-879f-a53797759b2a"
[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "farplane-feed-scout"
name = "Farplane Feed Scout"
kind = "cron"
status = "active"
prompt = '''
Use $feed-scout.

Run the bounded daily Feed Scout from the configured sources. Write its dated
report, then update and validate the configured persistent Markdown memory
before bounded source-backed candidate interventions. Re-render canonical ICP
fields from `farplane/harness.yaml#areas`; update only source-backed concerns,
language, trends, notable things, and source gaps. Merge or replace current
synthesis in place—do not append daily snapshots or a monthly timeline. You may create one
direct recovery ticket only for an evidenced existing failure with known fix,
KPI/guard, proof, and no experiment debt. Opportunities remain candidates for
the next-wave planner. Do not execute tickets.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
config_ref = "farplane/bindings.yaml#feed_scout"
window = "last_24h"
recovery_ticket_limit = 1
write_policy = "local recovery tickets only; no opportunity or experiment tickets"

Final response:
- Link the Feed Scout report path and summarize the strongest findings in 2-4 bullets.
- Link the memory path and include its changed headings, `updated_at`, source
  refs, and validation result.
- List direct recovery tickets created or updated, or `none`.
- List candidate interventions and their admission result: `created`,
  `planner_candidate`, `source_gap`, `blocked_by_gate`, or `not_ticketable`.
- Name source gaps, external side-effect gates, and next owner.
- Include the no-execution receipt.

Config source:
farplane/automations.toml automation id="farplane-feed-scout"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:15"

[[automations]]
id = "farplane-daily-interval"
name = "Farplane Daily BAU Review"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run the shared first-principles BAU review over the last 24 hours. Read metric
movement and outcomes, identify material stalls or regressions, select the
dominant bottleneck, separate symptom from root cause, rebuild the simplest
correct path from the objective, and compare the largest coherent compounding
interventions. Diagnose feedback-loop status; when instrumentation is missing,
compare a concrete evidence-capture unblock instead of optimizing from vibes.
Ground every problem/system gap in ticket, progress, metric, feedback, or
completed-report evidence. Finalize the dated report first, append sparse highlights
second, then apply every independently qualified ticket delta through the
configured authorized board route.

Known grounded interventions become concrete solution tickets or mutable todo
updates in this run. Admit uncertain work only when the investigation must
reproduce the cause, rule out alternatives, select the correction, and preserve
a proof artifact. Reject low-materiality, vague, duplicate, artifact-free,
planning-only, authority-unsafe, or protected-state rewrites. Apply no numeric
ticket cap. Preserve spend, publishing, customer-contact, account-change, and
private-data gates. Do not review harness experiments, mutate rewards, or
execute work.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
interval_id = "daily"
review_window = "last_24h"
refresh_metrics = true
refresh_scope = "selected_stale"
write_policy = "report, sparse highlights, then qualified ticket deltas through the configured authorized provider; no execution"
timezone = "Asia/Kuala_Lumpur"

Reads:
- latest completed Feed Scout report when present
- latest completed weekly BAU report when present

Final response:
- Link the report path and summarize the report in 2-4 bullets.
- List tickets created or updated, or `none`.
- Name what changed and why, feedback-loop status, the dominant bottleneck,
  root-cause confidence, blocked systems, and missing feedback.
- List each candidate intervention and ticket delta with the reason: `created`,
  `updated_todo`, `rejected_todo`, `investigation`, `duplicate`,
  `planner_candidate`, `low_materiality`, `planning_residue`, `source_gap`,
  `blocked_by_authority`, or `not_ticketable`.
- Name operator-needed items, source gaps, and next owner.
- Name the next native Goal/heartbeat owner without starting it.
- Include report-before-highlights-before-ticket-deltas and no-execution
  receipts: no harness experiment review, rewards mutation, Goal, Pulse,
  worker, or ticket execution.

Config source:
farplane/automations.toml automation id="farplane-daily-interval"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:33"

