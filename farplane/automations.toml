# Canonical desired-state Codex automation config for this Farplane project.
# Runtime logs, run IDs, last-run status, and automation memory stay outside tracked config.
schema = "farplane_project_automations"
framework_template_version = "1.0.0"
updated_at = "2026-07-11"
owner = "automation-advisor"

[[automations]]
id = "farplane-ticket-update"
name = "Farplane Work Pulse"
kind = "heartbeat"
status = "active"
prompt = '''
Use $pulse-update.

Run one bounded Work Pulse. Reconcile the board, make due ticket check-ins
eligible, dispatch executable tickets up to the worker limit, and refill an
empty BAU board through the next-wave planner. Pulse owns admission, dispatch,
worker-free review routing and reminders, and check-in routing; workers execute ticket
programs and produce proof. Do not implement ticket bodies inside the
heartbeat, and use Farplane V1 terminology rather than retired product or
v-next language.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
wave_size = 3
worker_limit = 1
review_wip = 3

Config source:
farplane/automations.toml automation id="farplane-ticket-update"
'''
[automations.target]
thread_id = "019ed47a-3182-73f3-879f-a53797759b2a"
[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "farplane-feed-scout"
name = "Farplane Feed Scout"
kind = "cron"
status = "active"
prompt = '''
Use $feed-scout.

Run the bounded daily Feed Scout from the configured sources. Write its dated
report first, then create at most three deduped, source-backed opportunity
tickets when the skill's evidence, authority, and ticket-quality gates pass.
Do not execute those tickets; Work Pulse owns execution.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
config_ref = "farplane/bindings.yaml#feed_scout"
window = "last_24h"
ticket_limit = 3
write_policy = "local ticket creation allowed; default review-required unless no human or external gate remains"

Config source:
farplane/automations.toml automation id="farplane-feed-scout"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:15"

[[automations]]
id = "farplane-daily-interval"
name = "Farplane Daily BAU Review"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run the daily BAU review for the last 24 hours. Write a dated report with the
incremental Problems ledger. You may create or update at most two maintenance
tickets only for unresolved, deduped problems evidenced before this run.
Same-run discoveries stay in the report. Do not plan new direction, review
harness experiments, mutate rewards, or execute tickets.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
interval_id = "daily"
review_window = "last_24h"
maintenance_ticket_limit = 2
write_policy = "local maintenance ticket creation allowed; default review-required unless no human or external gate remains"
timezone = "Asia/Kuala_Lumpur"

Reads:
- latest completed Feed Scout report when present
- latest completed weekly BAU report when present

Config source:
farplane/automations.toml automation id="farplane-daily-interval"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:33"

[[automations]]
id = "farplane-weekly-interval"
name = "Farplane Weekly BAU Review"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run the weekly BAU review. Summarize the completed daily reports and ticket
evidence into a dated report with the incremental Problems ledger. You may
create or update at most three maintenance tickets only for unresolved,
deduped problems evidenced before this run. Do not plan new direction, review
harness experiments, mutate rewards, or execute tickets.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
interval_id = "weekly"
review_window = "last_week"
maintenance_ticket_limit = 3
write_policy = "local maintenance ticket creation allowed; default review-required unless no human or external gate remains"
timezone = "Asia/Kuala_Lumpur"

Reads:
- completed daily BAU reports inside the review window
- completed Feed Scout reports inside the review window

Config source:
farplane/automations.toml automation id="farplane-weekly-interval"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "weekly"
timezone = "Asia/Kuala_Lumpur"
days = ["Mon"]
time = "05:45"

[[automations]]
id = "farplane-weekly-self-improvement"
name = "Farplane Weekly Self-Improvement"
kind = "cron"
status = "active"
prompt = '''
Use $dogfood-review.

Run the weekly self-improvement review. Review active and completed experiment
Goal Packets, recent archived experiment Goal Packets, the previous Dogfood
report, reward outcomes, pending check-ins, and tracked feature/system
evidence. Write the dated portfolio report first, then create a bounded,
non-interfering next wave from available capacity. Do not start or check in an
experiment; Work Pulse owns implementation and later check-ins by executing
the original ticket's program.md.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
window = "last_week"
experiment_wave_size = 2
experiment_wip_limit = 3
max_concurrent_live_delayed = 1
one_active_per_attributable_surface = true
write_policy = "local experiment Goal Packet creation allowed; default review-required unless no human or external gate remains"

Reads:
- active experiment Goal Packets
- recent archived experiment Goal Packets
- previous dated Dogfood report when present

Config source:
farplane/automations.toml automation id="farplane-weekly-self-improvement"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "weekly"
timezone = "Asia/Kuala_Lumpur"
days = ["Mon"]
time = "06:00"

[[automations]]
id = "farplane-monthly-registry-consolidation"
name = "Farplane Monthly Registry Consolidation"
kind = "cron"
status = "active"
prompt = '''
Use $consolidate.

Review the Farplane skill, feature, system, template, and source registries for
duplication, staleness, and wrong ownership. Write a dated consolidation report
without editing registries or creating tickets during this run.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
review_window = "last_month"
structure = "registry"

Config source:
farplane/automations.toml automation id="farplane-monthly-registry-consolidation"
'''
[automations.target]
workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "monthly"
timezone = "Asia/Kuala_Lumpur"
day_of_month = 1
time = "06:15"
