workspace = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
[automations.schedule]
type = "daily"
timezone = "Asia/Kuala_Lumpur"
time = "05:15"

[[automations]]
id = "farplane-daily-interval"
name = "Farplane Daily BAU Review"
kind = "cron"
status = "active"
prompt = '''
Use $interval-update.

Run one Daily Interval over the last 24 hours. Use one bounded evidence bundle
to produce the immutable Daily control-loop report, upsert source-fingerprinted
findings into the current weekly working draft, and write the sibling knowledge
receipt. Apply only explicitly supported mutable task progress. Do not create a
problem ticket or promote any Decision/Memory row, skill rule, project doc, Wiki
fact, quality edit, source comment, or outgoing chase. Do not execute work.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
interval_id = "daily"
review_window = "last_24h"
refresh_metrics = true
refresh_scope = "selected_stale"
write_policy = "report, weekly-draft upsert, sparse highlights, then explicitly supported mutable task progress through the configured authorized provider; no new ticket and no execution"
knowledge_write_policy = "stage every durable candidate in the current weekly draft; canonical promotions must be zero"
timezone = "Asia/Kuala_Lumpur"

Reads:
- latest completed Feed Scout report when present
- latest completed weekly BAU report when present
- current weekly working draft and latest Daily receipt when present

Gates:
- no deploy, publish, spend, customer contact, account mutation, destructive cleanup, or private-data expansion
- no raw transcript content in reports, docs, skills, receipts, or Wiki pages

Final response:
- Link the report, current weekly draft, and knowledge receipt.
- List candidate upserts, no-ops, task-progress updates, and source gaps.
- State `daily_canonical_promotions: 0`; list canonical knowledge owners changed
  as `none`.
- Name blockers,
  operator-needed items, and next owner.
- Include report-before-mutation and no-Goal/Pulse/worker/ticket-execution receipts.

