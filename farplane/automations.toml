[[automations]]
id = "farplane-weekly-self-improvement"
name = "Farplane Weekly Self-Improvement"
kind = "cron"
status = "active"
prompt = '''
Use $dogfood-review.

Run the weekly self-improvement review. Review active and completed experiment
Goal Packets, recent archived experiment Goal Packets, the previous Dogfood
report, reward outcomes, pending check-ins, and tracked feature/system
evidence. Write the dated retrospective report first, then use the shared
next-wave planner in the reserved self_improvement area to target five complete
experiment specs. Send admitted specs to Pulse's bounded materialization route.
Load the complete `harness.areas.self_improvement` record and apply
`harness.areas.self_improvement.planner_instruction` as the canonical
candidate-generation policy; do not replace it with automation-local area
instructions.
Do not execute experiments, dispatch workers, or decide/check in Reward rows in
this run. Return fewer than five only with explicit guard, duplicate, conflict,
source-gap, delayed-cap, or incomplete-spec evidence.

Params:
project_root = "/Users/kenjipcx/Zanarkand Technologies/projects/Farplane"
window = "last_week"
weekly_ticket_target = 5
recovery_ticket_limit = 1
planning_scope = "reserved_area:self_improvement"
max_concurrent_live_delayed = 5
one_active_per_attributable_surface = true
write_policy = "Pulse materialization only after the dated report"

Reads:
- active experiment Goal Packets
- recent archived experiment Goal Packets
- previous dated Dogfood report when present
- farplane/harness.yaml areas.self_improvement complete record and planner_instruction
- Core ticket history Reward receipts
- current harness metrics and skill/template/eval/QA rollout health

Final response:
- Link the retrospective report path and summarize the portfolio decision in 2-4 bullets.
- List specs/tickets admitted, sent to Pulse materialization, or rejected.
- List each shortfall or candidate decision with the reason: `admitted`,
  `already_owned`, `duplicate`, `conflict`, `source_gap`, `delayed_cap`,
  `incomplete_spec`, `blocked_by_gate`, or `not_ticketable`.
- Name operator-needed items, source gaps, and next owner.
- Include the no-execution receipt: no experiment execution, no dispatch, and
  no Reward decisions/check-ins.

Config source:
farplane/automations.toml automation id="farplane-weekly-self-improvement"
'''
