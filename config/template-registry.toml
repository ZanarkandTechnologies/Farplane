[template_registry]
# Focused registry of the highest-impact unstructured prompt templates. Broader
# document/version tracking is intentionally deferred.
# Consumers declare adoption with one field, `template_uses: {<template_id>:
# "x.y.z"}`, in YAML frontmatter or JSON. The rollout report lands in
# .farplane/generated/graphs/skill-template-intelligence.json
# (template_rollout_summary, template_rollout).
paths = [
  "runtimes/AGENTS.md",
  "skills/harness/templates/SKILL_TEMPLATE.md",
  "skills/harness/templates/METHOD_REFERENCE_TEMPLATE.md",
  "skills/harness/templates/GOLDEN_EXAMPLE.md",
  "skills/harness/references/EVAL_TASK_TEMPLATE.json",
  "tickets/templates/ticket.md",
  "tickets/templates/goal-loop/program.md",
  "tickets/templates/goal-loop/progress.md",
  "skills/setup-advisor/templates/project-harness.md",
  "skills/setup-advisor/references/MANIFEST_TEMPLATE.json",
  "skills/report-gen/templates/human-report.md",
  "skills/manage-wiki/templates/creator-page.md",
]
