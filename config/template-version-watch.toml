[template_version_watch]
# Humans own this watchlist. Keep it focused on high-impact prompt-shaped
# templates whose structure materially changes harness behavior.
paths = [
  "docs/skills/templates/SKILL_TEMPLATE.md",
  "docs/skills/templates/METHOD_REFERENCE_TEMPLATE.md",
  "skills/harness/references/EVAL_TASK_TEMPLATE.json",
  "runtimes/AGENTS.md",
  "tickets/templates/ticket.md",
  "tickets/templates/goal-loop/program.md",
  "skills/setup-advisor/templates/project-harness.md",
  "skills/setup-advisor/references/MANIFEST_TEMPLATE.json",
  "docs/templates/HUMAN_REPORT_TEMPLATE.md",
]

globs = []

exclude_globs = [
  "skills/harness/templates/archive/*",
  "skills/harness/templates/archive/**/*",
  "tickets/archive/*",
  "tickets/archive/**/*",
  "**/__pycache__/**/*",
  "**/*.pyc",
  "**/*lock.yaml",
]
