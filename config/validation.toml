schema_version = 1

[phase.planning]
checks = ["ticket.metadata", "ticket.reward", "ticket.contract-diagram", "ticket.context-budget"]

[phase.complete]
checks = ["ticket.metadata", "ticket.reward", "ticket.contract-diagram", "ticket.context-budget", "ticket.completion-evidence"]

# Selection is implemented through allowlisted path families. This file is the
# durable policy surface; ticket Markdown never supplies raw commands.
[[path_check]]
globs = ["skills/**"]
checks = ["skills.check"]

[[path_check]]
globs = ["README.md", "ARCHITECTURE.md", "docs/**"]
checks = ["docs.refs", "docs.contracts"]

[[path_check]]
globs = ["docs/features/**", "docs/systems/**"]
checks = ["docs.features"]

[[path_check]]
globs = ["farplane/sources/**"]
checks = ["docs.sources"]

[[path_check]]
globs = ["templates/**", "skills/harness/templates/**", "config/template-registry.*"]
checks = ["templates.check"]

[[path_check]]
globs = ["farplane/**", "runtimes/codex/config.toml.example"]
checks = ["project.check"]

[[path_check]]
globs = ["AGENTS.md", "agents/**", "config/**", "bin/**"]
checks = ["harness.check"]
