# Capability Map: specialist desks.
#
# A specialist is one desk in the office that groups skill variants. Each desk
# owns its display label, department, deliverable, primary skill (its default
# verb), and member `skills`. A member must be in the desk's department and may
# sit at only one desk. Skills at no desk are internal:
# planners dispatch them, and the map omits them.


[specialists.business-reviewer]
label = "Business Reviewer"
department = "leadership"
deliverable = "an offer, money model, or lead gen review with one next test"
primary = "review-business"
skills = ["review-business"]

