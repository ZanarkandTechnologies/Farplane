[pre_commit]
# Fast, staged-only checks. Keep this cheap enough that normal commits still feel
# local and predictable.
mode = "block"
checks = [
  "staged_diff_check",
  "ticket_closure_gate",
  "template_version_staged",
  "large_file_guard",
  "changed_file_line_count",
]

[[pre_commit.path_check]]
globs = ["skills/**", "docs/skills/**"]
checks = ["skill_file_line_count", "skill_check"]

[[pre_commit.path_check]]
globs = ["tickets/**"]
checks = ["ticket_metadata"]

[pre_push]
# Branch-level checks. This is where cross-commit drift, duplicated patterns,
# stale docs, and heavyweight review belong.
mode = "block"
base = "origin/main"
checks = [
  "branch_diff_check",
]

[[pre_push.path_check]]
globs = ["skills/**", "docs/skills/**"]
checks = ["skill_check"]

[[pre_push.path_check]]
globs = ["tickets/**"]
checks = ["ticket_metadata"]

[[pre_push.path_check]]
globs = ["README.md", "ARCHITECTURE.md", "docs/**"]
checks = ["doc_refs", "doc_parity"]

[[pre_push.path_check]]
globs = ["AGENTS.md", "templates/global/**", "rules/**", "bin/**", ".githooks/**"]
checks = ["harness_invariants"]

[large_file_guard]
max_bytes = 1048576
skip_globs = [
  "docs/features/*.md",
]

[changed_file_line_count]

[[changed_file_line_count.rule]]
name = "project-memory"
globs = ["memory.mb", "docs/MEMORY.md"]
max_lines = 500

[[changed_file_line_count.rule]]
name = "skill-source"
globs = ["skills/**"]
exclude_globs = [
  "skills/**/assets/**",
  "skills/**/graph/**",
  "skills/**/node_modules/**",
  "skills/**/self-improve/results/**",
  "skills/**/self-improve/runs/**",
  "skills/**/package-lock.json",
  "skills/**/pnpm-lock.yaml",
  "skills/**/yarn.lock",
]
max_lines = 200

[checks.staged_diff_check]
argv = ["git", "diff", "--cached", "--check"]

[checks.branch_diff_check]
argv = ["git", "diff", "--check", "{base}...HEAD"]

[checks.template_version_staged]
argv = ["python3", "bin/validators/check_template_version_metadata.py", "--staged"]

[checks.skill_check]
argv = ["python3", "skills/skill-maintenance/scripts/check_skills.py"]

[checks.ticket_metadata]
argv = ["python3", "tickets/scripts/check_ticket_metadata.py"]

[checks.ticket_closure_gate]
argv = ["python3", "bin/validators/check_ticket_closure_gate.py"]

[checks.doc_refs]
argv = ["python3", "bin/validators/check_doc_refs.py"]

[checks.doc_parity]
argv = ["python3", "bin/validators/check_doc_parity.py"]

[checks.harness_invariants]
argv = ["python3", "bin/validators/check_harness_invariants.py"]

[checks.changed_file_line_count]
mode = "warn"
argv = ["python3", "bin/validators/check_changed_file_line_count.py", "--config", "rules/git-review-gates.toml", "--rule", "project-memory"]

[checks.skill_file_line_count]
mode = "block"
argv = ["python3", "bin/validators/check_changed_file_line_count.py", "--config", "rules/git-review-gates.toml", "--rule", "skill-source"]
