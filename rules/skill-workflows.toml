# Explicit admission for the static Capability Map.
#
# This is not a workflow, call graph, process order, or runtime schedule. A
# listed package must declare an artifact or integration `capability` contract
# and retain the matching `group` in its own SKILL.md. Empty departments keep
# their real org anchor while no capability has been intentionally admitted.

[capability_admission]
"back-office" = []
sales = []
deals = []
marketing = ["content-impl-plan", "x-thread", "x-account"]
operations = []
intelligence = ["intelligest"]
customer = []

# Operator-facing names for only the admitted packages. Their department and
# artifact contracts and integration roles come from skill frontmatter, never this display map.
[capability_labels]
content-impl-plan = "Content Production Ticket"
intelligest = "Intelligence Dossier"
x-thread = "X Thread Writer"
x-account = "X Publishing"
