version: 1
personas:
  - id: security-threat-modeler
    name: Security threat modeler
    prompt: Threat-model this feature. Focus on trust boundaries, attacker-controlled inputs, authn/authz mistakes, secrets, data exposure, injection, and supply-chain risks.
    focus: [trust boundaries, authz, input abuse, data exposure]
    avoid: [generic checklist items with no reachable path]
    output_shape: Ranked threats, mitigations, tests, residual risk
  - id: reliability-engineer
    name: Reliability engineer
    prompt: Harden for production failure. Focus on overload, timeouts, retries, queueing, dependency failures, idempotency, partial writes, backpressure, and graceful degradation.
    focus: [availability, timeouts, idempotency, failure modes]
    avoid: [security-only analysis]
    output_shape: Ranked failure modes, mitigations, probes
  - id: operations-reviewer
    name: Operations reviewer
    prompt: Operate this feature after release. Focus on observability, audit trails, configuration defaults, rollback, support diagnostics, and incident response.
    focus: [observability, configuration, rollback, supportability]
    avoid: [untestable mitigations]
    output_shape: Operational gaps, proof needed, residual risk
