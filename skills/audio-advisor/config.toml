schema_version = "0.1.0"
skill = "audio-advisor"

[defaults]
voice_provider = "fish"
music_provider = "elevenlabs"
sfx_provider = "elevenlabs"
output_root = "artifacts/audio"
execution_mode = "dry_run"
sfx_route = "reuse_then_discover_then_operator_decides_then_generate"

[providers.soundbuttonsworld]
capabilities = ["sfx_candidate_discovery"]
url = "https://soundbuttonsworld.com/"
discovery = "public_web_index_item_pages_only"
retrieval = "operator_only"
default_rights_status = "unresolved"
site_terms_scope = "personal_noncommercial"
commercial_use_requires_separate_rights_evidence = true
agent_download = false

[profiles]
# Add named, repo-shareable, rights-cleared voice or generation profiles under
# tables such as [profiles.voice.explainer_narrator]. Keep personal/private
# voice IDs in invocation or private runtime context instead.

[providers.fish]
capabilities = ["voice"]
model = "s2.1-pro-free"
format = "mp3"
sample_rate = 44100
mp3_bitrate = 128
latency = "normal"

[providers.elevenlabs]
capabilities = ["voice", "music", "sfx"]

[providers.elevenlabs.voice]
model = "eleven_v3"
output_format = "mp3_44100_128"

[providers.elevenlabs.music]
model = "music_v2"
output_format = "mp3_48000_192"

[providers.elevenlabs.sfx]
model = "eleven_text_to_sound_v2"
output_format = "mp3_44100_128"
