schema = "farplane_steer_config"
version = "YYYY-MM-DD.0"
timezone = "UTC"
state_ref = ".farplane/state/steer-scheduler.json"

[_template_metadata]
template_id = "farplane-steer-config"
template_version = "0.2.0"
feature_refs = ["FEAT-0060"]
consumer_scope = "project"
applies_to = ["farplane/steer.config.toml"]

[template_uses]
farplane-steer-config = "0.2.0"

[[jobs]]
id = "daily_report"
cadence = "FREQ=DAILY;INTERVAL=1"
prompt = """
Run the Steer daily report workflow. Gather tickets, Pulse reports, worker-thread outcomes, and reports created since the previous daily interval; summarize what changed; label blockers or stale context; and write lightweight Pulse guidance.
"""

[[jobs]]
id = "weekly_steer"
cadence = "FREQ=WEEKLY;INTERVAL=1"
prompt = """
Run the Steer weekly scrum steering workflow. Gather tickets created, started, completed, blocked, or spawned since the last weekly interval; reflect on outcomes; check drift against goals; plan the next week; and route executable changes to tickets or Goal Advisor handoffs.
"""
