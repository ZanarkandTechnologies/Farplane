# One complete desired-state Codex automation. Runtime state stays outside Git.
schema = "farplane_project_automation"
framework_template_version = "1.0.0"
owner = "automation-advisor"

id = "project-daily-operating-update"
name = "Project Daily Operating Update"
kind = "cron"
status = "paused"
prompt = '''
Use $pm-daily.

Run one Company OS Daily pass: freeze the prior 24 hours; resolve Projects and
their exact local bindings; cache source-complete local context; call
`$pm-daily` once per eligible Project; validate its JSON; render Project Memory;
then apply only allowed updates to existing issues with revision checks and
readback. The skill reads local files only and performs no provider effect.

Do not create, assign, start, execute, or close work. Do not invent strategy,
promote broad knowledge, send external messages, or perform external side
effects. Missing sources remain explicit gaps.

Return context, extraction, and memory paths; movement; next commitments;
action receipts; source gaps; operator decisions; and `provider_execution: none`.

Config source:
farplane/automations/daily-operating-update.toml id="project-daily-operating-update"
'''
[target]
workspace = "<project-root>"
[schedule]
type = "daily"
timezone = "<timezone>"
time = "05:33"
