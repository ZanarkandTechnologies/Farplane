kind: project-bindings
status: draft
created_at: TODO
updated_at: TODO
framework_template_version: "0.4.0"
owner: project-pm-automation
project:
  id: TODO
  name: TODO
  root: TODO
human_gates:
  - post
  - publish
  - spend
  - deploy
  - external_contact
  - account_mutation
  - destructive_cleanup
integrations:
  github:
    repo: null
    remote: null
    default_branch: main
  notion:
    project_name: null
    project_page_url: null
    task_database_alias: null
    write_policy: local_first
  kanban:
    provider: filesystem_tickets
    filesystem_ticket_policy: include
    tickets_dir: tickets
    archive_dir: tickets/archive
    task_source_handle: null # for provider: notion; named private handle only, never a raw ID or URL
    write_policy: read_only_ui
    poll_seconds: 60
  posthog:
    project_id: null
    host: null
    dashboard_url: null
  vercel:
    project_id: null
    project_url: null
    production_url: null
metric_bindings:
  TODO_metric_name:
    refresh: TODO call $skill-name or $interval-update.helper_name(param="value", date="<YYYY-MM-DD>")
      to prepare this daily reading. Record source_gap when the reading cannot be collected.
  TODO_quality_metric:
    refresh: TODO call the proof or review owner that produces this quality reading for
      date="<YYYY-MM-DD>". Record source_gap when the reading cannot be collected.
  todo_unclaimed_ticket_count:
    refresh: Count unclaimed status=todo tickets under tickets/ whose dependencies are
      satisfied; store value/status/payload in the daily metric file.
  accepted_output_events:
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>",
      kpi_key="accepted_output_events") when this KPI is ticket-derived, or read the accepted
      reward ledger when configured.
  auto_time_ratio:
    refresh: Call $interval-update.calculate_autonomy_time_ratio(runtime_dir=".farplane",
      date="<YYYY-MM-DD>") and store the returned value/status/payload.
event_routes:
  - route_id: ticket-completion-learning-v1
    event_name: farplane.ticket.completed
    program_ref: core:ticket-completion-learning@1.1.0
  - route_id: ticket-completion-lean-v1
    event_name: farplane.ticket.completed
    program_ref: core:ticket-completion-lean@1.0.0
