  ready_unclaimed_ticket_count:
    label: Ready unclaimed tickets
    description: Current count of ready, approval-free, unclaimed active tickets that are not complete or human-gated.
    product: project_control
    kind: point
    unit: tickets
    display: reading
    refresh: Count ready, approval-free, unclaimed tickets under tickets/ that are not complete
      or human-gated; store value/status/payload in the daily metric file.
  accepted_output_events:
    label: Accepted output events
    description: Daily count of completed tickets or reward-ledger events accepted for this project output KPI.
    product: productization
    kind: daily_count
    unit: events
    display: bar_plus_cumulative
    refresh: Call $interval-update.count_ticket_kpi_rewards(ticket_dir="tickets", date="<YYYY-MM-DD>",
      kpi_key="accepted_output_events") when this KPI is ticket-derived, or read the accepted
      reward ledger when configured.
  auto_time_ratio:
    label: Autonomous time ratio
    description: Autonomous worker elapsed minutes divided by estimated human attention minutes for the day.
    product: cross_product_autonomy
    kind: point
    unit: ratio
    display: reading
    refresh: Call $interval-update.calculate_autonomy_time_ratio(runtime_dir=".farplane",
      date="<YYYY-MM-DD>") and store the returned value/status/payload.
