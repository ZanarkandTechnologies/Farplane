kind: project-metrics
status: draft
created_at: TODO
updated_at: TODO
framework_template_version: "0.3.0"
owner: metric-advisor
refreshers:
  local_project_metrics:
    refresh: >-
      Run `farplane metrics primitives --project-root . --date <YYYY-MM-DD>
      --json`, then use interval helpers and canonical Harness Usage telemetry
      when available for requested local readings. Write
      separate flat observations and explicit source gaps.
    provides:
      - TODO_metric_name
      - TODO_quality_metric
      - todo_unclaimed_ticket_count
      - accepted_output_events
      - auto_time_ratio
metrics:
  TODO_metric_name:
    refresh_ref: local_project_metrics
    label: TODO metric label
    description: TODO explain what this metric means, including numerator/denominator or source window when relevant.
    pinned: false
    kind: daily_count
    unit: TODO_unit
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 7
  TODO_quality_metric:
    refresh_ref: local_project_metrics
    label: TODO quality metric label
    description: TODO explain the quality or proof threshold this metric measures.
    pinned: false
    kind: point
    unit: TODO_unit
    display: reading
    max_age_days: 7
    guard:
      operator: greater_than_or_equal
      threshold: 0
  todo_unclaimed_ticket_count:
    refresh_ref: local_project_metrics
    label: Todo unclaimed tickets
    description: Current count of unclaimed status=todo tickets with satisfied dependencies.
    pinned: false
    kind: point
    unit: tickets
    display: reading
  accepted_output_events:
    refresh_ref: local_project_metrics
    label: Accepted output events
    description: Daily count of completed tickets or reward-ledger events accepted for this project's output KPI.
    pinned: true
    kind: daily_count
    unit: events
    display: bar_plus_cumulative
    direction: maximize
    max_age_days: 7
  auto_time_ratio:
    refresh_ref: local_project_metrics
    label: Autonomous time ratio
    description: Autonomous worker elapsed minutes divided by estimated human attention minutes for the day.
    pinned: true
    kind: point
    unit: ratio
    display: reading
