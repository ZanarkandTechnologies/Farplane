# Canonical desired-state Codex automation config for this Farplane project.
# Runtime logs, run IDs, last-run status, and automation memory stay outside tracked config.
schema = "farplane_project_automations"
framework_template_version = "1.0.0"
updated_at = "YYYY-MM-DD"
owner = "automation-advisor"

[[automations]]
id = "project-work-pulse"
name = "Project Work Pulse"
kind = "heartbeat"
status = "paused"
prompt = '''
Use $pulse-update.

Run one bounded Work Pulse. Reconcile the board, make due ticket check-ins
eligible, dispatch unclaimed executable tickets, and refill an empty
unclaimed-ready board through one adaptive next-wave planner. Human-active
tickets do not consume Pulse worker capacity. Pulse owns admission, dispatch, review, and
check-in route; workers execute ticket programs and produce proof. Do not
implement ticket bodies inside the heartbeat.

Params:
project_root = "<project-root>"
wave_size = 3
worker_limit = 1
review_wip = 3

Config source:
farplane/automations.toml automation id="project-work-pulse"
'''
[automations.target]
thread_id = "<pulse-thread-id>"
[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "project-feed-scout"
name = "Project Feed Scout"
kind = "cron"
status = "paused"
prompt = '''
Use $feed-scout.

Run the bounded daily Feed Scout. Write its dated report and bounded
source-backed candidate interventions. You may create one direct recovery
ticket only for an evidenced existing failure with known fix and no experiment
debt. Opportunities remain planner candidates. Do not execute tickets.

Params:
project_root = "<project-root>"
config_ref = "farplane/bindings.yaml#feed_scout"
window = "last_24h"
recovery_ticket_limit = 1
write_policy = "local recovery tickets only; no opportunity or experiment tickets"

Config source:
farplane/automations.toml automation id="project-feed-scout"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:15"

[[automations]]
id = "project-daily-bau-review"
name = "Project Daily BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the daily BAU review. Write a dated report with the Problems ledger and
bounded candidate interventions for unresolved prior evidence. You may create
one evidence-backed direct recovery ticket with known fix and no experiment
debt. Do not plan new direction or execute tickets.

Params:
project_root = "<project-root>"
interval_id = "daily"
review_window = "last_24h"
maintenance_ticket_limit = 1
write_policy = "local recovery tickets only; no new direction or experiment tickets"

Config source:
farplane/automations.toml automation id="project-daily-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:33"

[[automations]]
id = "project-weekly-bau-review"
name = "Project Weekly BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the weekly BAU review from completed daily reports and ticket evidence.
Write a dated Problems ledger and bounded candidate interventions for prior
evidence. You may create up to two evidence-backed direct recovery tickets with
known fixes and no experiment debt. Do not plan new direction or execute work.

Params:
project_root = "<project-root>"
interval_id = "weekly"
review_window = "last_week"
maintenance_ticket_limit = 2
write_policy = "local recovery tickets only; no new direction or experiment tickets"

Config source:
farplane/automations.toml automation id="project-weekly-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "05:45"

[[automations]]
id = "project-weekly-self-improvement"
name = "Project Weekly Self-Improvement"
kind = "cron"
status = "paused"
prompt = '''
Use $dogfood-review.

Review active experiment Goal Packets, recent archived experiment Goal Packets,
the previous Dogfood report, reward outcomes, pending check-ins, and tracked
feature/system evidence. Write the dated portfolio report, bounded experiment
candidates, and at most one direct recovery ticket for a settled attributable
failure with known fix and no experiment debt. Do not create, start, or check
in an experiment ticket; the next-wave planner ranks uncertain experiments.

Params:
project_root = "<project-root>"
window = "last_week"
experiment_candidate_limit = 1
recovery_ticket_limit = 1
experiment_wip_limit = 3
max_concurrent_live_delayed = 1
one_active_per_attributable_surface = true
write_policy = "local recovery tickets only; no experiment ticket creation"

Reads:
- active experiment Goal Packets
- recent archived experiment Goal Packets
- previous dated Dogfood report when present

Config source:
farplane/automations.toml automation id="project-weekly-self-improvement"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "06:00"

[[automations]]
id = "project-monthly-registry-consolidation"
name = "Project Monthly Registry Consolidation"
kind = "cron"
status = "paused"
prompt = '''
Use $consolidate.

Review project registries for duplication, staleness, and wrong ownership.
Write a dated report without editing registries or creating tickets.

Params:
project_root = "<project-root>"
review_window = "last_month"
structure = "registry"

Config source:
farplane/automations.toml automation id="project-monthly-registry-consolidation"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "monthly"
timezone = "<timezone>"
day_of_month = 1
time = "06:15"
