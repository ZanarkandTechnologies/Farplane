# Canonical desired-state Codex automation config for this Farplane project.
# Runtime logs, run IDs, last-run status, and automation memory stay outside tracked config.
schema = "farplane_project_automations"
framework_template_version = "1.0.0"
updated_at = "YYYY-MM-DD"
owner = "automation-advisor"

[[automations]]
id = "project-work-pulse"
name = "Project Work Pulse"
kind = "heartbeat"
status = "paused"
prompt = '''
Use $pulse-update.

Run one bounded Work Pulse. Reconcile the board, make due ticket check-ins
eligible, dispatch executable tickets, and refill an empty BAU board through
the next-wave planner. Pulse owns the shared admission, dispatch, review, and
check-in route; workers execute ticket programs and produce proof. Do not
implement ticket bodies inside the heartbeat.

Params:
project_root = "<project-root>"
wave_size = 3
worker_limit = 1
review_wip = 3

Config source:
farplane/automations.toml automation id="project-work-pulse"
'''
[automations.target]
thread_id = "<pulse-thread-id>"
[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "project-feed-scout"
name = "Project Feed Scout"
kind = "cron"
status = "paused"
prompt = '''
Use $feed-scout.

Run the bounded daily Feed Scout. Write its dated report first, then create at
most three deduped, source-backed opportunity tickets when admission gates
pass. Do not execute tickets.

Params:
project_root = "<project-root>"
config_ref = "farplane/bindings.yaml#feed_scout"
window = "last_24h"
ticket_limit = 3
write_policy = "local ticket creation allowed; default status=awaiting_review unless no human or external gate remains"

Config source:
farplane/automations.toml automation id="project-feed-scout"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:15"

[[automations]]
id = "project-daily-bau-review"
name = "Project Daily BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the daily BAU review. Write a dated report with the Problems ledger, then
create or update at most two maintenance tickets only for unresolved problems
evidenced before this run. Do not plan new direction or execute tickets.

Params:
project_root = "<project-root>"
interval_id = "daily"
review_window = "last_24h"
maintenance_ticket_limit = 2
write_policy = "local maintenance ticket creation allowed; default status=awaiting_review unless no human or external gate remains"

Config source:
farplane/automations.toml automation id="project-daily-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:33"

[[automations]]
id = "project-weekly-bau-review"
name = "Project Weekly BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the weekly BAU review from completed daily reports and ticket evidence.
Write a dated Problems ledger, then create or update at most three maintenance
tickets only for previously evidenced unresolved problems. Do not plan new
direction or execute tickets.

Params:
project_root = "<project-root>"
interval_id = "weekly"
review_window = "last_week"
maintenance_ticket_limit = 3
write_policy = "local maintenance ticket creation allowed; default status=awaiting_review unless no human or external gate remains"

Config source:
farplane/automations.toml automation id="project-weekly-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "05:45"

[[automations]]
id = "project-weekly-self-improvement"
name = "Project Weekly Self-Improvement"
kind = "cron"
status = "paused"
prompt = '''
Use $dogfood-review.

Review active experiment Goal Packets, recent archived experiment Goal Packets,
the previous Dogfood report, reward outcomes, pending check-ins, and tracked
feature/system evidence. Write the dated portfolio report first, then create a
bounded, non-interfering next wave from available capacity. Do not start or
check in an experiment; Work Pulse owns execution and later check-ins by
executing the original ticket's program.md.

Params:
project_root = "<project-root>"
window = "last_week"
experiment_wave_size = 2
experiment_wip_limit = 3
max_concurrent_live_delayed = 1
one_active_per_attributable_surface = true
write_policy = "local experiment Goal Packet creation allowed; default status=awaiting_review unless no human or external gate remains"

Reads:
- active experiment Goal Packets
- recent archived experiment Goal Packets
- previous dated Dogfood report when present

Config source:
farplane/automations.toml automation id="project-weekly-self-improvement"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "06:00"

[[automations]]
id = "project-monthly-registry-consolidation"
name = "Project Monthly Registry Consolidation"
kind = "cron"
status = "paused"
prompt = '''
Use $consolidate.

Review project registries for duplication, staleness, and wrong ownership.
Write a dated report without editing registries or creating tickets.

Params:
project_root = "<project-root>"
review_window = "last_month"
structure = "registry"

Config source:
farplane/automations.toml automation id="project-monthly-registry-consolidation"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "monthly"
timezone = "<timezone>"
day_of_month = 1
time = "06:15"
