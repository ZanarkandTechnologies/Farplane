# Canonical desired-state Codex automation config for this Farplane project.
# Runtime logs, run IDs, last-run status, and automation memory stay outside tracked config.
schema = "farplane_project_automations"
framework_template_version = "1.0.0"
updated_at = "YYYY-MM-DD"
owner = "automation-advisor"

[[automations]]
id = "project-work-pulse"
name = "Project Work Pulse"
kind = "heartbeat"
status = "paused"
prompt = '''
Use $pulse-update.

Run one bounded multi-phase Work Pulse: maintenance, due review service,
dispatch, low-watermark refill, then one combined receipt. Reconcile all safe
terminal state, route at most the review chase limit without consuming a
worker, dispatch unclaimed executable tickets up to the worker limit, and call
the one adaptive next-wave planner whenever unclaimed ready supply ends below
the configured watermark. Review WIP backpressures dispatch, not planning.
Human-active tickets do not consume Pulse worker capacity. Workers execute
ticket programs and produce proof; do not implement ticket bodies or wait for
workers inside the heartbeat.
When configured Feed Scout memory exists, load it once and pass relevant
entry refs plus canonical per-area ICPs into Plan Next Wave. Outward-facing
tickets must name a baseline/default and intended belief or workflow delta;
memory is evidence, not authority.

Params:
project_root = "<project-root>"
wave_size = 3
worker_limit = 1
review_wip = 3
review_chase_limit = 1
ready_low_watermark = 1

Final response:
- State the action taken or no-op reason.
- List tickets dispatched, chased, admitted, completed/reconciled, or blocked.
- Summarize refill outcome, worker/review limits, source gaps, and next owner.
- Link any report, ticket, worker, or receipt artifacts created by the beat.

Config source:
farplane/automations.toml automation id="project-work-pulse"
'''
[automations.target]
thread_id = "<pulse-thread-id>"
[automations.schedule]
type = "interval"
interval_minutes = 30

[[automations]]
id = "project-feed-scout"
name = "Project Feed Scout"
kind = "cron"
status = "paused"
prompt = '''
Use $feed-scout.

Run the bounded daily Feed Scout. Write its dated report, then update and
validate the configured Markdown memory in place with canonical ICPs, current
trends, notable things, and source gaps. Merge current synthesis rather than
creating daily/monthly snapshots. Then produce bounded source-backed candidate
interventions. You may create one direct recovery
ticket only for an evidenced existing failure with known fix and no experiment
debt. Opportunities remain planner candidates. Do not execute tickets.

Params:
project_root = "<project-root>"
config_ref = "farplane/bindings.yaml#feed_scout"
window = "last_24h"
recovery_ticket_limit = 1
write_policy = "local recovery tickets only; no opportunity or experiment tickets"

Final response:
- Link the Feed Scout report path and summarize the strongest findings in 2-4 bullets.
- Link the memory path and report changed headings, source refs, and validation.
- List direct recovery tickets created or updated, or `none`.
- List candidate interventions and their admission result: `created`,
  `planner_candidate`, `source_gap`, `blocked_by_gate`, or `not_ticketable`.
- Name source gaps, external side-effect gates, and next owner.
- Include the no-execution receipt.

Config source:
farplane/automations.toml automation id="project-feed-scout"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:15"

[[automations]]
id = "project-daily-bau-review"
name = "Project Daily BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the daily BAU review. Write a dated report with the Problems ledger and
bounded candidate interventions for unresolved prior evidence. You may create
one evidence-backed direct recovery ticket with known fix and no experiment
debt. Do not plan new direction or execute tickets.

Params:
project_root = "<project-root>"
interval_id = "daily"
review_window = "last_24h"
refresh_metrics = false
refresh_scope = "selected_stale"
maintenance_ticket_limit = 1
write_policy = "local recovery tickets only; no new direction or experiment tickets"

Final response:
- Link the report path and summarize the report in 2-4 bullets.
- List tickets created or updated, or `none`.
- List each maintenance candidate/admission decision with the reason: `created`,
  `updated`, `already_owned`, `planner_candidate`, `source_gap`,
  `same_run_ledger`, `blocked_by_gate`, or `not_ticketable`.
- Name operator-needed items, source gaps, and next owner.
- Include the no-execution receipt.

Config source:
farplane/automations.toml automation id="project-daily-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "daily"
timezone = "<timezone>"
time = "05:33"

[[automations]]
id = "project-weekly-bau-review"
name = "Project Weekly BAU Review"
kind = "cron"
status = "paused"
prompt = '''
Use $interval-update.

Run the weekly BAU review from completed daily reports and ticket evidence.
Write a dated Problems ledger and bounded candidate interventions for prior
evidence. You may create up to two evidence-backed direct recovery tickets with
known fixes and no experiment debt. Do not plan new direction or execute work.

Params:
project_root = "<project-root>"
interval_id = "weekly"
review_window = "last_week"
maintenance_ticket_limit = 2
write_policy = "local recovery tickets only; no new direction or experiment tickets"

Final response:
- Link the report path and summarize the weekly pattern in 2-4 bullets.
- List tickets created or updated, or `none`.
- List each maintenance candidate/admission decision with the reason: `created`,
  `updated`, `already_owned`, `planner_candidate`, `source_gap`,
  `same_run_ledger`, `blocked_by_gate`, or `not_ticketable`.
- Name operator-needed items, source gaps, and next owner.
- Include the no-execution receipt.

Config source:
farplane/automations.toml automation id="project-weekly-bau-review"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "05:45"

[[automations]]
id = "project-weekly-self-improvement"
name = "Project Weekly Self-Improvement"
kind = "cron"
status = "paused"
prompt = '''
Use $dogfood-review.

Review active experiment Goal Packets, recent archived experiment Goal Packets,
the previous Dogfood report, Core ticket-history Reward outcomes, pending
check-ins, harness-health metrics, and tracked feature/system evidence. Write
the dated portfolio report first. Then use the shared next-wave planner with
`reserved_area:self_improvement` to target five complete experiment specs and
send admitted specs to Pulse's bounded materialization route. Pulse alone
writes the tickets. Do not execute, dispatch, decide Reward, or run check-ins.
Load the complete `harness.areas.self_improvement` record and apply
`harness.areas.self_improvement.planner_instruction` as the canonical
candidate-generation policy; do not replace it with automation-local area
instructions.
Create fewer than five only when a named hard gate rejects the remaining slots,
and record the exact shortfall reason. A direct recovery ticket may occupy at
most one of the five slots when the failure is settled, attributable, has a
known fix, and carries no experiment debt; it is never a sixth ticket.

Params:
project_root = "<project-root>"
window = "last_week"
weekly_ticket_target = 5
recovery_ticket_limit = 1
planning_scope = "reserved_area:self_improvement"
max_concurrent_live_delayed = 5
one_active_per_attributable_surface = true
write_policy = "Pulse materialization only after the dated report"

Reads:
- active experiment Goal Packets
- recent archived experiment Goal Packets
- previous dated Dogfood report when present
- farplane/harness.yaml areas.self_improvement complete record and planner_instruction
- Core active/archive ticket history with expected and actual Reward
- harness health, template rollout, skill eval, and feature/system evidence

Final response:
- Link the retrospective report path and summarize the portfolio decision in 2-4 bullets.
- List specs/tickets admitted, sent to Pulse materialization, or rejected.
- List each shortfall or candidate decision with the reason: `admitted`,
  `already_owned`, `duplicate`, `conflict`, `source_gap`, `delayed_cap`,
  `incomplete_spec`, `blocked_by_gate`, or `not_ticketable`.
- Name operator-needed items, source gaps, and next owner.
- Include the no-execution receipt.

Config source:
farplane/automations.toml automation id="project-weekly-self-improvement"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "weekly"
timezone = "<timezone>"
days = ["Mon"]
time = "06:00"

[[automations]]
id = "project-monthly-registry-consolidation"
name = "Project Monthly Registry Consolidation"
kind = "cron"
status = "paused"
prompt = '''
Use $consolidate.

Review project registries for duplication, staleness, and wrong ownership.
Write a dated report without editing registries or creating tickets.

Params:
project_root = "<project-root>"
review_window = "last_month"
structure = "registry"

Final response:
- Link the consolidation report path and summarize the key duplicate/stale/wrong-owner findings.
- List registry edits or tickets created; this run should normally report `none`.
- List recommended follow-ups with owner surface and reason.
- Name source gaps and include the no-mutation receipt.

Config source:
farplane/automations.toml automation id="project-monthly-registry-consolidation"
'''
[automations.target]
workspace = "<project-root>"
[automations.schedule]
type = "monthly"
timezone = "<timezone>"
day_of_month = 1
time = "06:15"
